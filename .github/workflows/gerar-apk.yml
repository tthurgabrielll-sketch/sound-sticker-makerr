name: Gerar APK Sound Sticker Maker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compilar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: unzip -o "SoundStickerMaker*.zip"

      - name: Gerar chave de assinatura Release
        run: |
          cd SoundStickerMaker
          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias soundsticker \
            -storepass SoundSticker2026 \
            -keypass SoundSticker2026 \
            -dname "CN=SoundStickerMaker, OU=Mobile, O=SoundStickerMaker, L=Brasil, ST=MG, C=BR"

      - name: Executar testes e compilar APK Release
        env:
          RELEASE_STORE_FILE: release-keystore.jks
          RELEASE_STORE_PASSWORD: SoundSticker2026
          RELEASE_KEY_ALIAS: soundsticker
          RELEASE_KEY_PASSWORD: SoundSticker2026
        run: |
          cd SoundStickerMaker
          gradle testDebugUnitTest assembleRelease

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: SoundStickerMaker-APK-Pronto
          path: SoundStickerMaker/app/build/outputs/apk/release/app-release.apk
